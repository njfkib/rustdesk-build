name: build-custom-client
# Build a RustDesk client. Build inputs are provided at build time.

on:
  workflow_dispatch:
    inputs:
      taskid:
        description: '构建任务 id'
        required: true
        type: string
      gen:
        description: '(optional)'
        required: false
        type: string
        default: ''
      callback_url:
        description: '(optional)'
        required: false
        type: string
        default: ''
      # ── rdauth 统一派发的 4 个新输入 ─────────────────────────────────────────────────
      #   rdauth 给【所有】平台 workflow 都发这 4 个;缺声明会导致 dispatch 直接 422 拒绝,
      #   所以即使本平台只用其中一部分,4 个也必须全部声明。
      #   linux 侧实际消费:arch(架构) + distro(打包格式);
      #   package_format(android apk/aab) / msi(windows) 在本平台声明但不使用。
      arch:
        description: 'CPU 架构: 空/x64 → x86_64;arm64 → aarch64'
        required: false
        type: string
        default: ''
      distro:
        description: 'linux 打包格式: 空/debian → deb+AppImage;fedora → rpm;suse → suse rpm;arch → pkg.tar.zst;appimage → AppImage;flatpak → flatpak'
        required: false
        type: string
        default: ''
      package_format:
        description: '(android apk/aab;linux 未使用)'
        required: false
        type: string
        default: ''
      msi:
        description: "(windows msi 'true'/'false';linux 未使用)"
        required: false
        type: string
        default: 'false'

permissions:
  contents: write

# RUST 1.75 / FLUTTER 3.24.5 / VCPKG 120deac... / frb 1.80.1)。VERSION 固定 1.4.9(我们的源码版本)。
env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.4.9"
  UPSTREAM_REF: "1.4.9" # 补齐资源用的 pin 死上游 tag

jobs:
  # ── 先生成 flutter_rust_bridge(reusable workflow,见 ./.github/workflows/bridge.yml)──
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    secrets: inherit
    with:
      version: '1.4.9'

  # ── 主编译:linux → 按 arch(x86_64/aarch64) × distro(deb/rpm/suse/arch/appimage/flatpak)派发 ──
  build:
    needs: generate-bridge
    name: build rustdesk linux
    #   arm64 走 GitHub 原生 arm runner(避免 x86 host 上 qemu 模拟 rust 编译直接超时);
    #   x64 保持 ubuntu-22.04 原状,与之前跑通的配置逐字一致。
    #   ★首次 CI 风险:私有仓库/组织若未开通 arm runner,arm64 任务会拿不到 runner 而排队/失败;
    #    x64 完全不受影响(runs-on 及所有分支都按 ARCH 门控)。
    runs-on: ${{ (inputs.arch == 'arm64' || inputs.arch == 'aarch64') && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    #   由 inputs 归一出的架构/格式参数,供各 step 用 ${{ env.* }} 消费(空值 → 现状 x86_64 + deb)。
    env:
      ARCH: ${{ (inputs.arch == 'arm64' || inputs.arch == 'aarch64') && 'aarch64' || 'x86_64' }}
      TARGET: ${{ (inputs.arch == 'arm64' || inputs.arch == 'aarch64') && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
      DEB_ARCH: ${{ (inputs.arch == 'arm64' || inputs.arch == 'aarch64') && 'arm64' || 'amd64' }}
      VCPKG_TRIPLET: ${{ (inputs.arch == 'arm64' || inputs.arch == 'aarch64') && 'arm64-linux' || 'x64-linux' }}
      BUILD_DISTRO: ubuntu18.04
      #   空/debian → deb(默认另打 AppImage);其余原样透传(fedora/suse/arch/appimage/flatpak)。
      FORMAT: ${{ (inputs.distro == '' || inputs.distro == 'debian') && 'deb' || inputs.distro }}
    outputs:
      file_url: ${{ steps.release.outputs.file_url }}
    steps:
      #   patch/config clone 到 /tmp,避免被源码 clone 干扰。
      - name: Fetch build inputs
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          PRIV: ${{ secrets.PRIVATE_REPO }}
        run: |
          set -e
          B="https://x-access-token:${GH_TOKEN}@github.com/${PRIV}.git"
          # 源码 → workspace 根(空目录,可直接 clone 进 .)
          git clone --depth 1 -b code "$B" .
          # patch / config → /tmp
          git clone --depth 1 -b patch  "$B" /tmp/patch
          git clone --depth 1 -b config "$B" /tmp/cfg
          SUF=""; [ -n "${{ inputs.gen }}" ] && SUF="-${{ inputs.gen }}"
          cp "/tmp/cfg/configs/${{ inputs.taskid }}${SUF}.json" ./config.json
          # 敏感配置值加掩码:appName/host/key 及其派生,一律不进公开 CI 日志
          for _v in "$(jq -r '.appName // empty' config.json)" "$(jq -r '.server.host // empty' config.json)" "$(jq -r '.server.key // empty' config.json)"; do
            [ -n "$_v" ] && echo "::add-mask::$_v"
          done

      #   xorg.conf 等;真实 flutter 编译 + deb + AppImage 都会用到,不补齐必然编译/打包失败。
      - name: Restore resources
        run: |
          set -e
          git clone --depth 1 --branch "${UPSTREAM_REF}" https://github.com/rustdesk/rustdesk.git /tmp/up
          rsync -a --ignore-existing --exclude='.git' /tmp/up/ ./
          rm -rf /tmp/up
          echo "已补齐资源;抽查: $(ls -1 res/scalable.svg res/32x32.png flutter/assets/icon.svg 2>&1 | tr '\n' ' ')"

      #   apply-config 已注入 host/key/api/appname/公司名/官网/下载链接/验签处理,并生成
      #   ./_custom_client.json。SRC = workspace 根 = $PWD。
      - name: Apply configuration
        run: |
          set -e
          chmod +x /tmp/patch/*.sh
          /tmp/patch/apply-config.sh "$PWD" "$PWD/config.json"

      #   apply-icons 需要 ImageMagick(convert/magick)从 config.json 的 icon/logo base64 生成
      #   res/icon.png 等 + flutter/assets/logo.svg。先装好,供下一步用。
      - name: Install ImageMagick
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick

      #   必须在 Restore resources(补齐上游默认图标)之后,自定义图标才能覆盖上游默认图标。
      #   写 res/icon.png / res/*.ico / res/*x*.png / res/mac-icon.png + flutter/assets/logo.svg。
      - name: Apply icons
        run: |
          set -e
          bash /tmp/patch/apply-icons.sh "$PWD" "$PWD/config.json"

      #   signMode=delete:apply-config 已删验签,直接 base64(json) 即可被客户端接受。
      #   signMode=swapkey:apply-config 已把内置公钥换成自签公钥,custom_.txt 需**用配对私钥签名**——
      #   TODO(v1):加 SIGN_PRIVKEY secret,对 _custom_client.json 签名后再 base64。
      - name: Generate config blob
        run: |
          set -e
          MODE=$(jq -r '.signMode // "delete"' config.json)
          if [ "$MODE" = "swapkey" ]; then
            echo "::warning::signMode=swapkey 尚未实现签名(需 SIGN_PRIVKEY);v0 先按未签处理"
          fi
          base64 -w0 ./_custom_client.json > ./custom_.txt
          echo "custom_.txt 生成: $(wc -c < ./custom_.txt) 字节"

      # ────────────────────────────────────────────────────────────────────────────────
      # (去掉 icon/logo 下载、appname/compname/url/download sed、allowCustom 等 whitelabel 逻辑)。
      # ────────────────────────────────────────────────────────────────────────────────
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7 # ★ rdgen 用 @v6(已弃用),升 v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm
          if [[ "${{ env.ARCH }}" == "x86_64" ]]; then
            sudo apt-get install -y qemu-user-static
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick rsync

      - name: Set Swap Space
        if: ${{ env.ARCH == 'x86_64' }}
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Free Space
        run: |
          df -h
          free -m

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

      - name: Compute output filename from appName
        run: |
          APP=$(jq -r '.appName // "rustdesk"' config.json)
          SAFE=$(printf '%s' "$APP" | tr -cd '[:alnum:]._-'); [ -z "$SAFE" ] && SAFE=custom
          echo "FILENAME=$SAFE" >> $GITHUB_ENV
          echo "output name set"

      - name: Disable rust bridge build
        run: |
          sed -i "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Restore bridge files
        uses: actions/download-artifact@v4 # ★ 钉 v4(配 bridge 的 upload-artifact@v4)
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          sudo apt install -y libva-dev && apt show libva-dev
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ env.VCPKG_TRIPLET }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ env.VCPKG_TRIPLET }}-rel-out.log" || true
        shell: bash

      - name: Restore bridge files (again, as rdgen)
        uses: actions/download-artifact@v4 # ★ 钉 v4
        with:
          name: bridge-artifact
          path: ./

      #     ★flutter 3.24.5 的 dropdown 补丁:改用容器内挂载路径 /workspace/.github/patches/...
      #        .github/patches 从上游 1.4.9 补回源码根,故此路径可靠)
      #     ★aarch64:参照官方,flutter 换成 sony/flutter-elinux;build.py 改用 flutter-elinux
      #        命令 + arm64 产物路径。x86_64 保持官方 flutter 原状。
      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8
        name: Build rustdesk (cargo + flutter + deb[/rpm/suse])
        id: build
        with:
          arch: ${{ env.ARCH }}
          distro: ${{ env.BUILD_DISTRO }}
          githubToken: ${{ github.token }}
          setup: |
            ls -l "${PWD}"
            ls -l /opt/artifacts/vcpkg/installed
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            echo -e "installing deps"
            apt-get install -y \
               build-essential \
               clang \
               cmake \
               curl \
               gcc \
               git \
               g++ \
               imagemagick \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libclang-10-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpam0g-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-10-dev \
               nasm \
               ninja-build \
               pkg-config \
               tree \
               python3 \
               rpm \
               unzip \
               wget \
               xz-utils \
               libssl-dev
            # we have libopus compiled by us.
            apt-get remove -y libopus-dev || true
            ls -l ./
            tree -L 3 /opt/artifacts/vcpkg/installed
          run: |
            # disable git safe.directory
            git config --global --add safe.directory "*"
            pushd /opt
            wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ env.TARGET }}.tar.gz
            tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
            cd rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ env.TARGET }} && ./install.sh
            rm -rf rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ env.TARGET }}
            # edit config
            mkdir -p ~/.cargo/
            echo """
              [source.crates-io]
              registry = 'https://github.com/rust-lang/crates.io-index'
            """ > ~/.cargo/config
            cat ~/.cargo/config
            # start build
            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            if [[ "${{ env.ARCH }}" == "aarch64" ]]; then
              export JOBS="--jobs 3"
            else
              export JOBS=""
            fi
            echo $JOBS

            cargo build --lib $JOBS --features hwcodec,flutter,unix-file-copy-paste --release
            rm -rf target/release/deps target/release/build
            rm -rf ~/.cargo

            # ── Setup Flutter ──────────────────────────────────────────────────────────
            #   x86_64: 官方 flutter;aarch64: sony/flutter-elinux(官方 Dart SDK 在 arm64 linux 不可用)。
            git config --global --add safe.directory "*"
            pushd /workspace
            case ${{ env.ARCH }} in
              aarch64)
                export PATH=/opt/flutter-elinux/bin:$PATH
                # build.py 换用 flutter-elinux 命令,产物路径 x64→arm64
                sed -i "s/flutter build linux --release/flutter-elinux build linux --verbose/g" ./build.py
                sed -i "s/x64\/release/arm64\/release/g" ./build.py
              ;;
              x86_64)
                export PATH=/opt/flutter/bin:$PATH
              ;;
            esac
            popd
            pushd /opt
            wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            case ${{ env.ARCH }} in
              aarch64)
                # clone flutter-elinux 并 reset 到与 FLUTTER_VERSION 对齐的 tag
                git clone https://github.com/sony/flutter-elinux.git || true
                pushd flutter-elinux
                  git fetch
                  git reset --hard ${{ env.FLUTTER_VERSION }}
                  bin/flutter-elinux doctor -v
                  bin/flutter-elinux precache --linux
                popd
                # ★finicky:从 x64 flutter 缓存拷 shader_lib 给 arm64 引擎(官方同款做法)。
                #  若 /opt/flutter 未预缓存导致 linux-x64/shader_lib 缺失,这里会报错——首次 CI 关注点。
                cp -R flutter/bin/cache/artifacts/engine/linux-x64/shader_lib flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64
                rm -rf flutter
              ;;
              x86_64)
                flutter doctor -v
              ;;
            esac

            # ★ flutter 3.24.5 需要 dropdown_menu enableFilter 补丁(上游 rustdesk 自家 CI 也打)。
            #   补丁文件由"资源补齐"从上游 1.4.9 补进了 /workspace/.github/patches。
            if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
              case ${{ env.ARCH }} in
                aarch64) FL_DIR=/opt/flutter-elinux/flutter ;;
                x86_64)  FL_DIR=/opt/flutter ;;
              esac
              if [ -f /workspace/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff ]; then
                pushd "$FL_DIR"
                git apply /workspace/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
                  || echo "::warning::dropdown 补丁 apply 失败/已应用,继续"
                popd
              else
                echo "::warning::未找到 dropdown 补丁,跳过(flutter 编译若因此失败见此处)"
              fi
            fi

            # ★ 重生成 flutter 各平台图标:apply-icons 已把 res/icon.png 换成自定义图标。
            #   best-effort,失败不阻断(linux 侧图标已由 res/*.png 覆盖;aarch64 下 flutter 命令
            #   可能不在 PATH,直接跳过也没关系)。
            pushd /workspace/flutter
            (flutter pub get && (dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons)) \
              || echo "::warning::flutter 图标重生成已跳过(linux 图标由 res/*.png 覆盖)"
            popd

            # ── build flutter → .deb ────────────────────────────────────────────────────
            pushd /workspace
            mkdir -p output
            chmod 777 output -R
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=${{ env.DEB_ARCH }}
            # 把 custom_.txt 烘焙进 deb(tmpdeb 会被 build.py 打进 /usr/share/rustdesk/)
            mkdir -p flutter/tmpdeb/usr/share/rustdesk
            cp ./custom_.txt ./flutter/tmpdeb/usr/share/rustdesk/custom_.txt

            python3 ./build.py --flutter --skip-cargo
            for name in *.deb; do
              mv "$name" /workspace/output/"${{ env.FILENAME }}-${{ env.ARCH }}.deb"
            done
            ls -l /workspace/output/

            # ── custom_.txt 注入 flutter bundle 根 ────────────────────────────────────────
            #   deb 经 tmpdeb 烘焙(见上);rpm(fedora/suse)/arch 的 spec/PKGBUILD 都是从
            #   flutter/build/linux/<x64|arm64>/release/bundle/* 拷进 /usr/share/rustdesk/,
            #   与 deb 同一运行时目录。把 custom_.txt 落进 bundle 根 → 这些格式一并内置定制配置。
            if [ "${{ env.ARCH }}" = "aarch64" ]; then BDL=flutter/build/linux/arm64/release/bundle; else BDL=flutter/build/linux/x64/release/bundle; fi
            if [ -d "$BDL" ]; then cp ./custom_.txt "$BDL/custom_.txt" && echo "custom_.txt → $BDL"; else echo "::warning::bundle 目录缺失,rpm/arch 未内置 custom_.txt: $BDL"; fi

            # ── 按 FORMAT 在容器内追加 rpm / suse rpm(rpm 已在 install 步装好)──────────────
            FMT="${{ env.FORMAT }}"
            if [ "$FMT" = "fedora" ]; then
              echo "start packaging fedora rpm"
              if [ "${{ env.ARCH }}" = "aarch64" ]; then sed -i "s#linux/x64#linux/arm64#g" ./res/rpm-flutter.spec; fi
              HBB=`pwd` rpmbuild ./res/rpm-flutter.spec -bb
              for name in ~/rpmbuild/RPMS/${{ env.ARCH }}/rustdesk*.rpm; do
                cp "$name" /workspace/output/"${{ env.FILENAME }}-${{ env.ARCH }}.rpm"
              done
            fi
            if [ "$FMT" = "suse" ]; then
              echo "start packaging suse rpm"
              if [ "${{ env.ARCH }}" = "aarch64" ]; then sed -i "s#linux/x64#linux/arm64#g" ./res/rpm-flutter-suse.spec; fi
              HBB=`pwd` rpmbuild ./res/rpm-flutter-suse.spec -bb
              for name in ~/rpmbuild/RPMS/${{ env.ARCH }}/rustdesk*.rpm; do
                cp "$name" /workspace/output/"${{ env.FILENAME }}-${{ env.ARCH }}-suse.rpm"
              done
            fi

      #   AppImage recipe 引用 res/*.png + res/scalable.svg(已由资源补齐补回)。
      #   默认(deb)与显式 appimage 时构建;从容器产出的 .deb 派生(故内含 custom_.txt)。
      - name: Build AppImage
        if: ${{ env.FORMAT == 'deb' || env.FORMAT == 'appimage' }}
        run: |
          set -e
          cp "./output/${FILENAME}-${{ env.ARCH }}.deb" appimage/rustdesk.deb
          sudo apt-get update -y
          sudo apt-get install -y libarchive-tools libfuse2
          sudo pip3 install "setuptools_scm<10"
          sudo pip3 install git+https://github.com/rustdesk-org/appimage-builder.git
          pushd appimage
          sudo appimage-builder --skip-tests --recipe ./AppImageBuilder-${{ env.ARCH }}.yml
          # recipe 产物是 <name>-<version>-<arch>.AppImage;用宽松 glob 收敛成我们的名字
          sudo mv ./*.AppImage "./${FILENAME}-${{ env.ARCH }}.AppImage"
          popd
          ls -l appimage/*.AppImage

      #   flatpak:参照官方,在 ubuntu22.04 容器里从 .deb 派生 flatpak bundle(故也内含 custom_.txt)。
      - name: Build flatpak
        if: ${{ env.FORMAT == 'flatpak' }}
        uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8
        with:
          arch: ${{ env.ARCH }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
          shell: /bin/bash
          install: |
            apt-get update -y
            apt-get install -y git flatpak flatpak-builder
          run: |
            git config --global --add safe.directory "*"
            pushd /workspace
            cp "./output/${{ env.FILENAME }}-${{ env.ARCH }}.deb" flatpak/rustdesk.deb
            pushd flatpak
            git clone https://github.com/flathub/shared-modules.git --depth=1 || true
            flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak-builder --user --install-deps-from=flathub -y --force-clean --repo=repo ./build ./rustdesk.json
            flatpak build-bundle ./repo "${{ env.FILENAME }}-${{ env.ARCH }}.flatpak" com.rustdesk.RustDesk

      #   archlinux:参照官方,仅 x86_64(x86 host 无法 makepkg arm64,且无最新 arm64 arch 镜像)。
      #   FLUTTER=1 makepkg 打包容器已产出的 flutter bundle(工作目录在 step 间保留)。
      #   NOTE(arm64+arch):官方也不在 CI 打 aarch64 arch 包;此组合会跳过打包,由下方 Collect fail-fast 明确报错(不静默产坏链)。
      - name: Build archlinux package
        if: ${{ env.FORMAT == 'arch' && env.ARCH == 'x86_64' }}
        uses: rustdesk-org/arch-makepkg-action@04200739ed1d0bf6f2188b6736b26a767c57a7f9
        with:
          packages:
          scripts: |
            cd res && HBB=`pwd`/.. FLUTTER=1 makepkg -f

      # ── 收集产物 + custom_.txt(按 FORMAT 只收实际产出的包)────────────────────────────
      - name: Collect artifacts
        run: |
          set -e
          # ★★ arch 真根因:makepkg-action(rustdesk/makepkg docker action)的 entrypoint 执行
          #   `chown -R build /github/workspace`,把整个 workspace 属主改成容器 build 用户(uid2000)。
          #   action 结束后 runner 用户(uid1001)再也无法写 workspace —— 连本步第一行 `mkdir dist`
          #   都 Permission denied 而挂(此前 x86_64+arch 一直失败于此,与 res/ glob 无关)。
          #   故 arch 时先把属主 chown 回 runner,后续 mkdir/cp/glob 全部恢复正常。
          if [ "${{ env.FORMAT }}" = "arch" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
          fi
          mkdir -p dist
          F="${{ env.FORMAT }}"; A="${{ env.ARCH }}"; N="${FILENAME}"
          case "$F" in
            deb)
              cp "./output/${N}-${A}.deb" dist/
              [ -f "./appimage/${N}-${A}.AppImage" ] && cp "./appimage/${N}-${A}.AppImage" dist/ || true
              ;;
            appimage)
              cp "./appimage/${N}-${A}.AppImage" dist/
              ;;
            fedora)
              cp "./output/${N}-${A}.rpm" dist/
              ;;
            suse)
              cp "./output/${N}-${A}-suse.rpm" dist/
              ;;
            flatpak)
              cp "./flatpak/${N}-${A}.flatpak" dist/
              ;;
            arch)
              # 属主已在本步开头 chown 回 runner。makepkg(PKGEXT=.pkg.tar.zst)在 res/ 同时产
              # rustdesk 与 rustdesk-debug 两个包,收主包(排除 -debug),收敛成确定名。
              # arm64+arch 时 archlinux 步已被 if 跳过 → res/ 无包,find 落空即 fail-fast(不静默产坏 release)。
              PKG=$(find . -name 'rustdesk-*.pkg.tar.zst' ! -name '*-debug-*' | head -1)
              if [ -z "$PKG" ]; then
                echo "::error::arch 包未找到(x86_64+arch 应由 makepkg 产出;arm64+arch CI 不支持)"
                find . -name '*.pkg.tar*'; exit 1
              fi
              cp "$PKG" "dist/${N}-${A}.pkg.tar.zst"
              echo "arch 包收集: $PKG → dist/${N}-${A}.pkg.tar.zst"
              ;;
          esac
          # custom_.txt 随包发布(客户端注入配置)
          cp ./custom_.txt "dist/${N}-custom_.txt"
          ls -l dist

      - name: Publish Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}  # ★ 用 PAT(有本repo Contents:RW);github.token 默认只读发不了Release(404)
        run: |
          set -e
          SUF=""; [ -n "${{ inputs.gen }}" ] && SUF="-${{ inputs.gen }}"
          TAG="build-${{ inputs.taskid }}${SUF}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --title "custom client ${{ inputs.taskid }}" \
            --notes "自动构建 (linux ${{ env.ARCH }} / ${{ env.FORMAT }}, rustdesk ${VERSION})"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          # 回调 file_url 指向该 FORMAT 的主产物
          case "${{ env.FORMAT }}" in
            fedora)   PRIMARY="${FILENAME}-${{ env.ARCH }}.rpm";;
            suse)     PRIMARY="${FILENAME}-${{ env.ARCH }}-suse.rpm";;
            appimage) PRIMARY="${FILENAME}-${{ env.ARCH }}.AppImage";;
            flatpak)  PRIMARY="${FILENAME}-${{ env.ARCH }}.flatpak";;
            arch)     PRIMARY="${FILENAME}-${{ env.ARCH }}.pkg.tar.zst";;
            *)        PRIMARY="${FILENAME}-${{ env.ARCH }}.deb";;
          esac
          echo "file_url=${BASE}/${PRIMARY}" >> "$GITHUB_OUTPUT"

  notify:
    needs: [generate-bridge, build]
    if: ${{ always() && inputs.callback_url != '' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Notify
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            STATUS="done"
            FILE="${{ needs.build.outputs.file_url }}"
          else
            STATUS="error"
            FILE=""
          fi
          echo "callback: status=$STATUS file=$FILE"
          curl -s -X POST "${{ inputs.callback_url }}" \
            -H 'Content-Type: application/json' \
            -d "{\"taskid\":\"${{ inputs.taskid }}\",\"gen\":\"${{ inputs.gen }}\",\"status\":\"${STATUS}\",\"file\":\"${FILE}\"}" || true
