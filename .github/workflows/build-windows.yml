name: build-custom-client-windows
run-name: build-windows ${{ inputs.arch == 'x86' && 'x86' || 'x86_64' }}
# 编译一个把自建服务器地址和 Key 写死、且隐藏网络设置界面的 RustDesk 客户端(Windows 便携版 exe,可选 msi)
# 改编自 njfkib/rustdesk-build .github/workflows/build-windows.yml;源码源改官方 1.4.9,免 PAT。

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '(optional) CPU 架构: 空/x64 → x86_64-pc-windows-msvc;x86 → i686-pc-windows-msvc(32位,不出 msi)'
        required: false
        type: string
        default: ''
      msi:
        description: "(optional) 是否额外打 msi: 'true' 才打,否则只出 portable exe(x86 强制不打)"
        required: false
        type: string
        default: 'false'

permissions:
  contents: read

# RUST 1.75 / FLUTTER 3.24.5 / LLVM 15.0.6 / VCPKG 120deac...(与 njfkib 一致,官方 CI 同款)。
# VERSION 固定 1.4.9(本套件的源码版本)。
env:
  RUST_VERSION: "1.75"          # sciter/1.78 有 i128 ABI 变更,钉 1.75
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b" # vcpkg 2024.07.12
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.4.9"

jobs:
  # ── 先生成 flutter_rust_bridge(复用 ./.github/workflows/bridge.yml)──
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: '1.4.9'

  # ── 主编译:windows → portable .exe (+ 可选 .msi) ─────────────────────────
  build-windows:
    needs: generate-bridge
    name: build rustdesk windows ${{ inputs.arch == 'x86' && 'x86' || 'x86_64' }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: "${{ inputs.arch == 'x86' && 'i686-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}",
              os: windows-2022,
              arch: "${{ inputs.arch == 'x86' && 'x86' || 'x86_64' }}",
              vcpkg-triplet: "${{ inputs.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}",
            }
    steps:
      # 本仓库(apply-config.sh + config.json)checkout 到 custom/ 子目录
      - name: Checkout custom build kit
        uses: actions/checkout@v4
        with:
          path: custom

      # 官方源码 → workspace 根(空目录,clone 进 .)+ submodule(hbb_common 必须,服务器/Key 常量在此)
      - name: Clone RustDesk ${VERSION} source
        shell: bash
        run: |
          set -e
          git clone --depth 1 --branch ${VERSION} https://github.com/rustdesk/rustdesk.git .
          git -c submodule."libs/hbb_common".shallow=true submodule update --init --depth 1
          echo "source cloned: $(git rev-parse --short HEAD)"
          test -f libs/hbb_common/src/config.rs && echo "submodule hbb_common OK"

      # 从 config.json 计算 appname / filename → $GITHUB_ENV;敏感值加掩码
      - name: Compute appname/filename from config.json
        shell: bash
        run: |
          set -e
          APP=$(jq -r '.appName // "RustDesk"' custom/config.json)
          SAFE=$(printf '%s' "$APP" | tr -cd '[:alnum:]._-'); [ -z "$SAFE" ] && SAFE=rustdesk
          echo "appname=$APP"   >> "$GITHUB_ENV"
          echo "filename=$SAFE" >> "$GITHUB_ENV"
          for _v in "$(jq -r '.appName // empty' custom/config.json)" "$(jq -r '.server.host // empty' custom/config.json)" "$(jq -r '.server.key // empty' custom/config.json)"; do
            [ -n "$_v" ] && echo "::add-mask::$_v"
          done

      # ── 核心注入:host/key 写死进 hbb_common/src/config.rs,删 custom.txt 签名校验,
      #    生成 custom.txt(含 override-settings:hide-network-settings 等)。──
      - name: Apply configuration + generate custom.txt
        shell: bash
        run: |
          set -e
          bash ./custom/patch/apply-config.sh "$PWD" "$PWD/custom/config.json"
          echo "--- 注入后抽查 ---"
          grep -n 'RENDEZVOUS_SERVERS\|RS_PUB_KEY' libs/hbb_common/src/config.rs | head -4
          grep -c 'signMode=delete' src/common.rs
          ls -l custom.txt

      # ── ★ Windows 专属改名(apply-config.sh 不碰 flutter/windows/runner/Runner.rc 与 res/msi)──
      - name: change appname (windows runner resource)
        if: env.appname != 'RustDesk'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|"RustDesk Remote Desktop"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc || true
          sed -i -e 's|VALUE "InternalName", "rustdesk" "\0"|VALUE "InternalName", "${{ env.appname }}" "\0"|' ./flutter/windows/runner/Runner.rc || true
          sed -i -e 's|"rustdesk.exe"|"${{ env.filename }}.exe"|' ./flutter/windows/runner/Runner.rc || true
          sed -i -e 's|"RustDesk"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc || true
          sed -i -e 's|RustDesk|${{ env.appname }}|' ./res/msi/Package/License.rtf 2>/dev/null || true

      # ── ★ 含空格 appname 的注册表引号修复(src/platform/windows.rs)──
      - name: fix registry if appname has a space
        if: contains(env.appname, ' ')
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|reg add {}|reg add \\\"{}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|{subkey}|\\\"{subkey}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg delete HKEY_CLASSES_ROOT\\\\.{ext} /f|reg delete \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs

      # ── Export GitHub Actions cache environment variables(vcpkg x-gha 二进制缓存)──
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # ── Restore bridge files(从 generate-bridge 下载还原到源码树)──
      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock || true
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml || true

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # ── 用 rustdesk 定制 flutter 引擎替换官方引擎(编译必需,见 flutter#155685)──
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      # ── flutter 3.24.5 的 dropdown_menu enableFilter 补丁(上游 rustdesk 自家 CI 也打)──
      - name: Patch flutter
        shell: bash
        run: |
          DIFF=.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          if [ -f "$DIFF" ] && [ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]; then
            FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
            cp "$DIFF" "$FLUTTER_ROOT"/
            ( cd "$FLUTTER_ROOT" && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff ) \
              || echo "::warning::dropdown 补丁 apply 失败/已应用,继续"
          else
            echo "::warning::未找到 dropdown 补丁或 flutter 版本不符,跳过"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true

      # ── 核心编译:build.py 出 flutter runner Release + 附带 usbmmidd 虚拟显示器驱动 ──
      - name: Build rustdesk (cargo + flutter runner)
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      # ── 把 custom.txt 放进产物目录(portable/msi 打包都会连带打进去,客户端启动读取)──
      - name: Embed custom.txt into bundle
        shell: bash
        run: |
          cp ./custom.txt ./rustdesk/custom.txt
          ls -l ./rustdesk/custom.txt

      # ── 取 Runner.res(含真实版本信息;portable packer 需要嵌入)──
      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found"
          else
            echo "Runner.res: $runner_res"
            cp "$runner_res" ./libs/portable/Runner.res
            ls -l ./libs/portable/Runner.res
          fi

      # ── 打 portable 自解压 exe(libs/portable/generate.py)──
      - name: Build self-extracted executable
        shell: bash
        run: |
          set -e
          if [ "${{ env.appname }}" != "RustDesk" ]; then
            mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ env.appname }}.exe"
          fi
          sed -i '/dpiAware/d' res/manifest.xml || true
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ env.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/rustdesk.exe"
          ls -l ./SignOutput/

      # ── (可选)WiX 打 msi;仅当 inputs.msi=='true' 且非 x86 时打(默认跳过,只出 portable exe)──
      - name: Add MSBuild to PATH
        if: ${{ inputs.msi == 'true' && inputs.arch != 'x86' }}
        uses: microsoft/setup-msbuild@v2

      - name: Build msi (optional)
        if: ${{ inputs.msi == 'true' && inputs.arch != 'x86' }}
        continue-on-error: true
        run: |
          $myappname = "${{ env.appname }}" -replace '\s','_'
          cp "rustdesk/${{ env.appname }}.exe" "rustdesk/${myappname}.exe" -ErrorAction SilentlyContinue
          pushd ./res/msi
          python preprocess.py --app-name "$myappname" --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          cp ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk.msi
          popd

      # ── 收集 + 命名产物(exe 必有;msi best-effort;附 custom.txt)──
      - name: Collect artifacts
        shell: bash
        run: |
          set -e
          mkdir -p dist
          if [ -f "./SignOutput/rustdesk.exe" ]; then
            mv "./SignOutput/rustdesk.exe" "./SignOutput/${{ env.filename }}.exe"
          fi
          cp "./SignOutput/${{ env.filename }}.exe" "dist/${{ env.filename }}-${{ matrix.job.arch }}.exe"
          if [ -f "./SignOutput/rustdesk.msi" ]; then
            mv "./SignOutput/rustdesk.msi" "./SignOutput/${{ env.filename }}.msi" || true
            cp "./SignOutput/${{ env.filename }}.msi" "dist/${{ env.filename }}-${{ matrix.job.arch }}.msi" || true
          fi
          cp ./custom.txt "dist/custom.txt" || true
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom-${{ env.filename }}-windows-${{ matrix.job.arch }}
          path: dist/
          if-no-files-found: error
