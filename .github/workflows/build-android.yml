name: build-custom-client-android
# 编译一个把自建服务器地址和 Key 写死、且隐藏网络设置界面的 RustDesk 客户端(Android .apk / .aab)
# 改编自 njfkib/rustdesk-build .github/workflows/build-android.yml;源码源改官方 1.4.9,免 PAT。
# 与 njfkib 的差异:custom.txt 通过 apply-config.sh 打补丁的 MainService.kt
# (readCustomClientConfig() 读 assets/custom.txt)注入,而非在 CI 里内嵌 base64。

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'CPU 架构: 空/aarch64 → arm64-v8a;armv7 → armeabi-v7a;x86_64 → x86_64'
        required: false
        type: string
        default: ''
      package_format:
        description: '包格式: 空/apk → apk(split-per-abi);aab → appbundle'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# RUST 1.75 / FLUTTER 3.24.5 / NDK r28c / cargo-ndk 3.1.2 / VCPKG 120deac...
env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.4.9"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: '1.4.9'

  build:
    needs: generate-bridge
    name: build rustdesk android ${{ inputs.arch || 'aarch64' }}
    runs-on: ubuntu-24.04
    steps:
      # ── inputs.arch / inputs.package_format → env(参数化,不写死 arm64)──
      - name: Resolve build params
        shell: bash
        run: |
          set -e
          case "${{ inputs.arch }}" in
            ""|aarch64|arm64)
              ARCH=aarch64;  RUST_TARGET=aarch64-linux-android;   ANDROID_ABI=arm64-v8a;   TARGET_PLATFORM=android-arm64; LIBCXX_TRIPLE=aarch64-linux-android; NDK_SCRIPT=ndk_arm64.sh ;;
            armv7|arm|armeabi-v7a)
              ARCH=armv7;    RUST_TARGET=armv7-linux-androideabi; ANDROID_ABI=armeabi-v7a; TARGET_PLATFORM=android-arm;   LIBCXX_TRIPLE=arm-linux-androideabi; NDK_SCRIPT=ndk_arm.sh ;;
            x86_64|x64)
              ARCH=x86_64;   RUST_TARGET=x86_64-linux-android;    ANDROID_ABI=x86_64;      TARGET_PLATFORM=android-x64;   LIBCXX_TRIPLE=x86_64-linux-android;  NDK_SCRIPT=ndk_x64.sh ;;
            *)
              echo "::error::unsupported arch '${{ inputs.arch }}' (expect empty/aarch64/armv7/x86_64)"; exit 1 ;;
          esac
          case "${{ inputs.package_format }}" in
            ""|apk) PKG_FMT=apk; PKG_EXT=apk ;;
            aab)    PKG_FMT=aab; PKG_EXT=aab ;;
            *) echo "::error::unsupported package_format '${{ inputs.package_format }}' (expect empty/apk/aab)"; exit 1 ;;
          esac
          {
            echo "ARCH=$ARCH"
            echo "RUST_TARGET=$RUST_TARGET"
            echo "ANDROID_ABI=$ANDROID_ABI"
            echo "TARGET_PLATFORM=$TARGET_PLATFORM"
            echo "LIBCXX_TRIPLE=$LIBCXX_TRIPLE"
            echo "NDK_SCRIPT=$NDK_SCRIPT"
            echo "PKG_FMT=$PKG_FMT"
            echo "PKG_EXT=$PKG_EXT"
            echo "RELTYPE=release"
          } >> "$GITHUB_ENV"
          echo "resolved: arch=$ARCH target=$RUST_TARGET abi=$ANDROID_ABI platform=$TARGET_PLATFORM fmt=$PKG_FMT"

      # 本仓库(apply-config.sh + config.json)checkout 到 custom/ 子目录
      - name: Checkout custom build kit
        uses: actions/checkout@v4
        with:
          path: custom

      # 官方源码 → workspace 根 + submodule(hbb_common)
      - name: Clone RustDesk ${VERSION} source
        run: |
          set -e
          git clone --depth 1 --branch ${VERSION} https://github.com/rustdesk/rustdesk.git .
          git -c submodule."libs/hbb_common".shallow=true submodule update --init --depth 1
          echo "source cloned: $(git rev-parse --short HEAD)"
          test -f libs/hbb_common/src/config.rs && echo "submodule hbb_common OK"

      # 从 config.json 计算 appname / filename;敏感值加掩码
      - name: Compute appname/filename from config.json
        shell: bash
        run: |
          set -e
          APP=$(jq -r '.appName // "RustDesk"' custom/config.json)
          SAFE=$(printf '%s' "$APP" | tr -cd '[:alnum:]._-'); [ -z "$SAFE" ] && SAFE=custom
          echo "appname=$APP"   >> "$GITHUB_ENV"
          echo "filename=$SAFE" >> "$GITHUB_ENV"
          # androidAppId 缺省则保持原包名(下方改包名步骤有 if 守卫,不改就跳过)
          echo "androidappid=$(jq -r '.androidAppId // "com.carriez.flutter_hbb"' custom/config.json)" >> "$GITHUB_ENV"
          for _v in "$(jq -r '.appName // empty' custom/config.json)" "$(jq -r '.server.host // empty' custom/config.json)" "$(jq -r '.server.key // empty' custom/config.json)"; do
            [ -n "$_v" ] && echo "::add-mask::$_v"
          done

      # ── 核心注入:host/key 写死 + 删验签 + MainService.kt 读 assets/custom.txt + 生成 custom.txt ──
      - name: Apply configuration + generate custom.txt
        shell: bash
        run: |
          set -e
          bash ./custom/patch/apply-config.sh "$PWD" "$PWD/custom/config.json"
          echo "--- 注入后抽查 ---"
          grep -n 'RENDEZVOUS_SERVERS\|RS_PUB_KEY' libs/hbb_common/src/config.rs | head -4
          grep -c 'signMode=delete' src/common.rs
          grep -n 'readCustomClientConfig' flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          ls -l custom.txt

      # ── 把 custom.txt 放进 flutter assets(pubspec.yaml 已声明 assets/ 目录,任意文件打进 APK)──
      - name: Embed custom.txt into flutter assets
        shell: bash
        run: |
          mkdir -p flutter/assets
          cp ./custom.txt ./flutter/assets/custom.txt
          ls -l ./flutter/assets/custom.txt

      # ── 仅 appName != RustDesk 时执行(channel: 默认 RustDesk 保持原样,不引入风险)──
      - name: change appname to custom (android/flutter)
        if: env.appname != 'RustDesk'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|RustDesk|${{ env.appname }}|' ./flutter/android/app/src/main/res/values/strings.xml || true
          sed -i -e "s|title: 'RustDesk'|title: '${{ env.appname }}'|" ./flutter/lib/main.dart || true
          sed -i 's|android:label="RustDesk"|android:label="${{ env.appname }}"|' ./flutter/android/app/src/main/AndroidManifest.xml || true

      - name: change app id to custom
        if: env.androidappid != 'com.carriez.flutter_hbb'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|com.carriez.flutter_hbb|${{ env.androidappid }}|' ./flutter/android/app/build.gradle || true

      - name: Remove scam alert on Android
        continue-on-error: true
        shell: bash
        run: |
          sed -i 's/bind.mainGetLocalOption(key:\s*"show-scam-warning")/"N"/g' ./flutter/lib/mobile/pages/server_page.dart || true

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpam0g-dev \
               libpulse-dev \
               libva-dev \
               libvdpau-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               rsync \
               tree \
               wget

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # ── flutter 3.24.5 的 dropdown_menu enableFilter 补丁(上游 1.4.9 自家 CI 也打)──
      - name: Patch flutter
        continue-on-error: true
        run: |
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      # ── android 原生依赖(opus/libyuv 等,经 flutter/build_android_deps.sh + vcpkg)──
      - name: Install vcpkg dependencies
        shell: bash
        run: |
          ANDROID_TARGET="${{ env.ANDROID_ABI }}"
          if ! ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.RUST_TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: ${{ env.RUST_TARGET }}

      # 编 native lib(参数化,不写死 arm64)
      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ env.RUST_TARGET }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ env.NDK_SCRIPT }}
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ env.ANDROID_ABI }}
          cp ./target/${{ env.RUST_TARGET }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/${{ env.ANDROID_ABI }}/librustdesk.so

      # ★signingConfigs.release→debug:用 flutter 默认 debug keystore 出可安装 apk;aab 同样 debug 签。
      - name: Build rustdesk (apk/aab)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # 提高 Gradle JVM 内存
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # 用 debug 签名配置(ad-hoc),避免依赖 keystore secret
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          # 该 abi 的 libc++_shared + rust native lib 放进 jniLibs
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ env.ANDROID_ABI }}
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ env.LIBCXX_TRIPLE }}/libc++_shared.so ./flutter/android/app/src/main/jniLibs/${{ env.ANDROID_ABI }}/
          cp ./target/${{ env.RUST_TARGET }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/${{ env.ANDROID_ABI }}/librustdesk.so
          pushd flutter
          if [ "${{ env.PKG_FMT }}" = "aab" ]; then
            flutter build appbundle "--${{ env.RELTYPE }}" --target-platform ${{ env.TARGET_PLATFORM }}
            mv build/app/outputs/bundle/${{ env.RELTYPE }}/app-${{ env.RELTYPE }}.aab ../rustdesk-${{ env.VERSION }}-${{ env.ARCH }}.aab
          else
            flutter build apk "--${{ env.RELTYPE }}" --target-platform ${{ env.TARGET_PLATFORM }} --split-per-abi
            mv build/app/outputs/flutter-apk/app-${{ env.ANDROID_ABI }}-${{ env.RELTYPE }}.apk ../rustdesk-${{ env.VERSION }}-${{ env.ARCH }}.apk
          fi
          popd
          # 收敛成我们的产物名 <filename>-<arch>.<ext>
          mkdir -p signed-apk
          mv ./rustdesk-${{ env.VERSION }}-${{ env.ARCH }}.${{ env.PKG_EXT }} ./signed-apk/${{ env.filename }}-${{ env.ARCH }}.${{ env.PKG_EXT }}
          ls -l signed-apk

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p dist
          cp "./signed-apk/${{ env.filename }}-${{ env.ARCH }}.${{ env.PKG_EXT }}" dist/
          cp ./custom.txt "dist/custom.txt"
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom-${{ env.filename }}-android-${{ env.ARCH }}-${{ env.PKG_EXT }}
          path: dist/
          if-no-files-found: error
