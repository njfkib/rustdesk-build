name: Build flutter-rust-bridge
# Build a RustDesk client. Build inputs are provided at build time.

# 改编说明:原作(njfkib/rustdesk-build)从私有 fork 三分支拉取 "code" 源码,需要 PAT;
# 本套件改为直接 clone 官方 rustdesk 1.4.9(公开仓库,免 PAT),patch 由本仓库注入。

on:
  workflow_call:
    inputs:
      version:
        description: '(optional) rustdesk tag'
        required: false
        default: '1.4.9'
        type: string

# flutter pub get;1.4.9 的 pubspec 约束是 dart '^3.1.0',3.22.3 自带 dart 3.4 满足),
# 主编译才用 3.24.5。frb codegen 版本 1.80.1、cargo-expand 1.0.95、rust 1.75 一律照抄官方。
env:
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503

jobs:
  generate_bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-24.04,
              extra-build-args: "",
            }
    steps:
      # 本仓库(含 patch/apply-config.sh + config.json)checkout 到 custom/ 子目录,不污染源码根。
      - name: Checkout custom build kit
        uses: actions/checkout@v4
        with:
          path: custom

      # 官方源码 → workspace 根(空目录,clone 进 .)+ submodule(hbb_common)。
      - name: Clone RustDesk ${{ inputs.version }} source
        run: |
          set -e
          git clone --depth 1 --branch ${{ inputs.version }} https://github.com/rustdesk/rustdesk.git .
          git -c submodule."libs/hbb_common".shallow=true submodule update --init --depth 1
          echo "source cloned: $(git rev-parse --short HEAD)"
          test -f libs/hbb_common/src/config.rs && echo "submodule hbb_common OK"

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ca-certificates \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-${{ matrix.job.os }}

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@v4
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-frb-${{ matrix.job.target }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          pushd flutter && sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
